<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="NØMADIC | Spaans Leren - Powered by Webnox">
    <meta name="theme-color" content="#050505">

    <title>NØMADIC | Spaans Masterclass</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Space+Grotesk:wght@300;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CSS VARIABLES & THEME SETUP --- */
        :root {
            /* ADULT THEME */
            --a-bg: #050505;
            --a-surface: #121212;
            --a-surface-hover: #1E1E1E;
            --a-primary: #CCFF00;
            --a-secondary: #00F0FF;
            --a-text: #Eaeaea;
            --a-border: rgba(255, 255, 255, 0.08);

            /* KID THEME */
            --k-bg: #F0F4F8;
            --k-surface: #FFFFFF;
            --k-primary: #FF6B6B;
            --k-secondary: #4ECDC4;
            --k-accent: #FFD93D;
            --k-text: #2D3436;
            --k-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);

            /* SHARED */
            --radius-xl: 24px;
            --radius-md: 16px;
            --max-width: 900px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* --- GLOBAL RESET --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--a-bg);
            color: var(--a-text);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding-bottom: 90px;
            /* Space for navbar */
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        /* --- MODE STYLES --- */
        /* ADULT */
        body[data-mode="adult"] {
            background: var(--a-bg);
        }

        body[data-mode="adult"] .glass {
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--a-border);
        }

        body[data-mode="adult"] .btn-primary {
            background: var(--a-primary);
            color: #000;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(204, 255, 0, 0.3);
            border-radius: 8px;
        }

        /* KID */
        body[data-mode="kid"] {
            font-family: 'Nunito', sans-serif;
            background: var(--k-bg);
            color: var(--k-text);
            background-image: radial-gradient(var(--k-secondary) 10%, transparent 10%), radial-gradient(var(--k-primary) 10%, transparent 10%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        body[data-mode="kid"] .glass {
            background: white;
            border-top: 2px solid #eee;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.05);
        }

        body[data-mode="kid"] .btn-primary {
            background: var(--k-primary);
            color: white;
            border-radius: 50px;
            border-bottom: 5px solid #d63031;
        }

        body[data-mode="kid"] .btn-primary:active {
            border-bottom-width: 0;
            transform: translateY(5px);
        }

        /* --- COMPONENTS --- */
        .app-container {
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- NAVIGATION --- */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            padding-bottom: 10px;
        }

        .nav-item {
            opacity: 0.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
            cursor: pointer;
        }

        .nav-item i {
            font-size: 1.5rem;
        }

        .nav-item span {
            font-size: 0.7rem;
            font-weight: bold;
        }

        .nav-item.active {
            opacity: 1;
            transform: translateY(-5px);
        }

        body[data-mode="adult"] .nav-item.active {
            color: var(--a-primary);
        }

        body[data-mode="kid"] .nav-item.active {
            color: var(--k-primary);
        }

        /* --- DASHBOARD --- */
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        body[data-mode="adult"] .stat-card {
            background: var(--a-surface-hover);
            border: 1px solid var(--a-border);
        }

        body[data-mode="kid"] .stat-card {
            background: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        /* --- GRID --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .card {
            padding: 15px;
            border-radius: var(--radius-md);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 140px;
            transition: 0.2s;
        }

        /* Adult Card */
        body[data-mode="adult"] .card {
            background: var(--a-surface);
            border: 1px solid var(--a-border);
        }

        body[data-mode="adult"] .card:active {
            border-color: var(--a-primary);
            transform: scale(0.98);
        }

        /* Kid Card */
        body[data-mode="kid"] .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 0 #eee;
        }

        body[data-mode="kid"] .card:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #eee;
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .card h3 {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .check-mark {
            position: absolute;
            top: 8px;
            right: 8px;
            color: #2ecc71;
            opacity: 0;
            font-size: 0.8rem;
        }

        .card.done .check-mark {
            opacity: 1;
        }

        /* --- ACTIVITY VIEW (OVERLAY) --- */
        #activity-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .game-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .progress-container {
            flex: 1;
            height: 8px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #2ecc71;
            transition: 0.3s;
        }

        .game-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- FLASHCARDS & OPTIONS --- */
        .flashcard {
            width: 100%;
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        body[data-mode="adult"] .flashcard {
            background: #1a1a1a;
            border: 1px solid #333;
        }

        body[data-mode="kid"] .flashcard {
            background: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        .btn-opt {
            width: 100%;
            padding: 18px;
            margin-bottom: 10px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        body[data-mode="adult"] .btn-opt {
            background: #222;
            color: #fff;
            border: 1px solid #333;
        }

        body[data-mode="adult"] .btn-opt:active {
            border-color: var(--a-primary);
        }

        body[data-mode="kid"] .btn-opt {
            background: white;
            color: var(--k-text);
            border: 2px solid #f0f0f0;
        }

        body[data-mode="kid"] .btn-opt:active {
            border-color: var(--k-primary);
            background: #fff5f5;
        }

        .btn-opt.correct {
            background: #2ecc71 !important;
            color: white !important;
            border-color: #27ae60 !important;
        }

        .btn-opt.wrong {
            background: #e74c3c !important;
            color: white !important;
            border-color: #c0392b !important;
        }

        /* --- NEW ACTIVITY TYPES --- */
        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .match-item {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        body[data-mode="adult"] .match-item {
            background: #1a1a1a;
            border: 1px solid #333;
        }

        body[data-mode="kid"] .match-item {
            background: white;
            border: 2px solid #f0f0f0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .match-item.matched {
            background: #2ecc71 !important;
            color: white !important;
            border-color: #27ae60 !important;
            transform: scale(0.98);
        }

        .drag-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .drop-zone {
            padding: 25px;
            border-radius: 12px;
            border: 2px dashed #666;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body[data-mode="kid"] .drop-zone {
            border-color: #ddd;
            background: #f9f9f9;
        }

        .drag-item {
            padding: 20px;
            border-radius: 12px;
            background: #222;
            text-align: center;
            cursor: grab;
            font-weight: bold;
        }

        body[data-mode="kid"] .drag-item {
            background: white;
            border: 2px solid var(--k-secondary);
            color: var(--k-text);
        }

        .drag-item:active {
            cursor: grabbing;
            opacity: 0.8;
        }

        .sentence-builder {
            width: 100%;
            background: #1a1a1a;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        body[data-mode="kid"] .sentence-builder {
            background: white;
            border: 2px solid #f0f0f0;
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
        }

        .word-piece {
            padding: 12px 20px;
            border-radius: 8px;
            background: #333;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        body[data-mode="kid"] .word-piece {
            background: var(--k-accent);
            color: #333;
        }

        .sentence-display {
            min-height: 80px;
            border: 2px dashed #444;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        body[data-mode="kid"] .sentence-display {
            border-color: #ddd;
            background: #f9f9f9;
        }

        /* --- SPLASH --- */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 5000;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        .mode-btn {
            width: 200px;
            padding: 25px;
            margin: 10px;
            border-radius: 20px;
            cursor: pointer;
            text-align: center;
            border: 2px solid transparent;
        }

        /* --- PROFILE --- */
        .profile-container {
            text-align: center;
            padding: 40px 20px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: #eee;
        }

        body[data-mode="adult"] .avatar {
            background: linear-gradient(135deg, var(--a-primary), var(--a-secondary));
            color: black;
        }

        .webnox-badge {
            margin-top: 40px;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            text-decoration: none;
            opacity: 0.7;
            transition: 0.3s;
        }

        .webnox-badge:hover {
            opacity: 1;
            transform: scale(1.02);
        }

        body[data-mode="adult"] .webnox-badge {
            border: 1px solid #333;
            color: #888;
            background: #111;
        }

        body[data-mode="kid"] .webnox-badge {
            border: 2px dashed #ddd;
            color: #888;
            background: #fff;
        }

        /* --- SPEAKING PRACTICE --- */
        .mic-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            margin: 30px auto;
            cursor: pointer;
            border: none;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
            transition: all 0.3s;
        }

        .mic-button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(255, 107, 107, 0.3);
        }

        .mic-button.listening {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #00b09b, #96c93d);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(0, 176, 155, 0.7);
            }

            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 20px rgba(0, 176, 155, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(0, 176, 155, 0);
            }
        }

        .transcript-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            min-height: 60px;
            text-align: center;
            font-style: italic;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        body[data-mode="kid"] .transcript-box {
            background: white;
            border: 2px solid #eee;
            color: #333;
        }

        .pronunciation-feedback {
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            font-weight: bold;
        }

        .pronunciation-feedback.good {
            background: rgba(46, 204, 113, 0.2);
            color: #27ae60;
            border: 1px solid #27ae60;
        }

        .pronunciation-feedback.needs-work {
            background: rgba(231, 76, 60, 0.2);
            color: #c0392b;
            border: 1px solid #c0392b;
        }
    </style>
</head>

        let AppState = {
            mode: 'adult',
            score: parseInt(localStorage.getItem('score')) || 0,
            streak: 1,
            completed: JSON.parse(localStorage.getItem('completed')) || [],
            currentLesson: null,
            step: 0,
            selectedMatches: [],
            sentenceWords: [],
            recognition: null
        };

        // --- INIT ---
        function initApp(mode) {
            AppState.mode = mode;
            document.body.setAttribute('data-mode', mode);

            // Initialize speech recognition if available
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                AppState.recognition = new SpeechRecognition();
                AppState.recognition.lang = 'es-ES';
                AppState.recognition.continuous = false;
                AppState.recognition.interimResults = false;
            }

            // Fade out splash
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').classList.add('hidden');
                document.getElementById('main-nav').classList.remove('hidden');
                document.getElementById('app').classList.remove('hidden');
                renderDashboard();
                updateStats();
            }, 500);
        }

        // --- NAVIGATION ---
        function switchTab(tab) {
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-profile').classList.add('hidden');
            document.getElementById('view-' + tab).classList.remove('hidden');

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const idx = tab === 'dashboard' ? 0 : 1;
            document.querySelectorAll('.nav-item')[idx].classList.add('active');

            if (tab === 'profile') renderProfile();
        }

        // --- RENDER DASHBOARD ---
        function renderDashboard() {
            const grid = document.getElementById('lesson-grid');
            grid.innerHTML = '';

            const lessons = DB[AppState.mode];
            lessons.forEach((lesson, i) => {
                const isDone = AppState.completed.includes(lesson.id);
                const card = document.createElement('div');
                card.className = `card ${isDone ? 'done' : ''}`;
                card.innerHTML = `
                    <div class="check-mark"><i class="fas fa-check-circle"></i></div>
                    <div class="card-icon" style="color: ${AppState.mode === 'kid' ? 'var(--k-secondary)' : 'var(--a-primary)'}">
                        <i class="fas fa-${lesson.icon}"></i>
                    </div>
                    <h3>${lesson.title}</h3>
                `;
                card.onclick = function () { openGame(lesson); };

                card.style.animation = `fadeIn 0.5s ease forwards ${i * 0.05}s`;
                card.style.opacity = '0';

                grid.appendChild(card);
            });
        }

        function updateStats() {
            document.getElementById('score').innerText = AppState.score;
            document.getElementById('streak').innerText = AppState.streak;
        }

        function renderProfile() {
            document.getElementById('total-xp').innerText = AppState.score;
            document.getElementById('profile-name').innerText = AppState.mode === 'kid' ? 'Kleine Held' : 'Urban Nomad';

            const totalLessons = DB[AppState.mode].length * 50;
            let pct = Math.min((AppState.score / totalLessons) * 100, 100);
            document.getElementById('xp-bar').style.width = pct + '%';
        }

        // --- GAME ENGINE ---
        function openGame(lesson) {
            AppState.currentLesson = lesson;
            AppState.step = 0;
            AppState.selectedMatches = [];
            AppState.sentenceWords = [];

            document.getElementById('activity-view').classList.remove('hidden');
            document.getElementById('main-nav').classList.add('hidden');
            document.getElementById('lesson-title').innerText = lesson.title;

            renderStep();
        }

        function closeActivity() {
            document.getElementById('activity-view').classList.add('hidden');
            document.getElementById('main-nav').classList.remove('hidden');
            renderDashboard();
            updateStats();
        }

        function renderStep() {
            const container = document.getElementById('game-engine');
            const nextBtn = document.getElementById('next-btn');
            const feedback = document.getElementById('feedback');

            container.innerHTML = '';
            feedback.innerHTML = '';
            nextBtn.classList.add('hidden');

            const total = AppState.currentLesson.content.length;
            const progress = (AppState.step / total) * 100;
            document.getElementById('game-progress').style.width = progress + '%';

            if (AppState.step >= total) {
                finishGame(container);
                return;
            }

            const item = AppState.currentLesson.content[AppState.step];

            // --- QUIZ TYPE ---
            if (AppState.currentLesson.type === 'quiz') {
                container.innerHTML = `
                    <div class="flashcard">
                        <h2 style="font-size:2.5rem; margin-bottom:10px;">${item.nl}</h2>
                        <p style="opacity:0.6;">Kies de vertaling (Selecciona)</p>
                    </div>
                `;

                let options = [item.es];
                AppState.currentLesson.content.forEach(x => {
                    if (x.es !== item.es && options.length < 3) options.push(x.es);
                });
                while (options.length < 3) { options.push("Hola"); options.push("Sí"); }

                options.sort(() => Math.random() - 0.5);

                options.forEach(opt => {
                    const btn = document.createElement('div');
                    btn.className = 'btn-opt';
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswer(opt, item.es, btn);
                    container.appendChild(btn);
                });
            }

            // --- MEMORY TYPE ---
            else if (AppState.currentLesson.type === 'memory') {
                container.innerHTML = `
                    <div class="flashcard" onclick="speak('${item.es}')">
                         <i class="fas fa-volume-up" style="opacity:0.5; margin-bottom:10px;"></i>
                        <h2 style="font-size:3rem; margin-bottom:10px; color:${AppState.mode === 'adult' ? 'var(--a-primary)' : 'var(--k-primary)'}">${item.es}</h2>
                        <h3 style="opacity:0.8;">(${item.nl})</h3>
                    </div>
                `;

                setTimeout(() => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-primary';
                    btn.innerText = 'Begrepen / Entendido';
                    btn.style.width = '100%';
                    btn.style.padding = '15px';
                    btn.style.border = 'none';
                    btn.style.cursor = 'pointer';
                    btn.onclick = () => { AppState.step++; renderStep(); };
                    container.appendChild(btn);
                    speak(item.es);
                }, 300);
            }

            // --- MATCHING GAME TYPE ---
            else if (AppState.currentLesson.type === 'matching') {
                container.innerHTML = `
                    <div class="flashcard">
                        <h3 style="margin-bottom:20px;">Empareja las palabras (Match the words)</h3>
                        <p style="opacity:0.6;">Toca una palabra en español y luego su traducción</p>
                    </div>
                    <div class="match-grid" id="match-grid"></div>
                `;

                const grid = document.getElementById('match-grid');
                const items = AppState.currentLesson.content;
                let allItems = [];

                // Create both Spanish and Dutch items
                items.forEach(item => {
                    allItems.push({ text: item.nl, matchId: item.match, type: 'nl' });
                    allItems.push({ text: item.es, matchId: item.match, type: 'es' });
                });

                // Shuffle
                allItems.sort(() => Math.random() - 0.5);

                // Create buttons
                allItems.forEach(item => {
                    const btn = document.createElement('div');
                    btn.className = 'match-item';
                    btn.innerText = item.text;
                    btn.dataset.matchId = item.matchId;
                    btn.dataset.type = item.type;
                    btn.onclick = () => handleMatchSelection(btn);
                    grid.appendChild(btn);
                });
            }

            // --- DRAG & DROP TYPE ---
            else if (AppState.currentLesson.type === 'dragdrop') {
                container.innerHTML = `
                    <div class="flashcard">
                        <h3 style="margin-bottom:20px;">${item.nl}</h3>
                        <p style="opacity:0.6;">${item.hint}</p>
                        <p><small>Arrastra la respuesta correcta</small></p>
                    </div>
                    <div class="drag-container">
                        <div class="drop-zone" id="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)">
                            Suelta la respuesta aquí
                        </div>
                        <div class="drag-item" draggable="true" id="drag-item" ondragstart="drag(event)">
                            ${item.es}
                        </div>
                        <div class="drag-item" draggable="true" ondragstart="drag(event)">
                            Respuesta incorrecta
                        </div>
                        <div class="drag-item" draggable="true" ondragstart="drag(event)">
                            Otra opción
                        </div>
                    </div>
                `;
            }

            // --- SPEAKING PRACTICE TYPE ---
            else if (AppState.currentLesson.type === 'speaking') {
                container.innerHTML = `
                    <div class="flashcard">
                        <h3 style="margin-bottom:20px;">Habla en español</h3>
                        <h2 style="font-size:2rem; margin-bottom:20px;">"${item.nl}"</h2>
                        <p style="opacity:0.6;">Di la frase en voz alta en español</p>
                    </div>
                    <div class="transcript-box" id="transcript-box">
                        Tu pronunciación aparecerá aquí...
                    </div>
                    <button class="mic-button" id="mic-button" onclick="startListening()">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <div id="pronunciation-feedback" class="pronunciation-feedback"></div>
                `;
            }

            // --- SENTENCE BUILDER TYPE ---
            else if (AppState.currentLesson.type === 'sentence') {
                const words = [...item.words];
                words.sort(() => Math.random() - 0.5);
                AppState.sentenceWords = words;

                container.innerHTML = `
                    <div class="flashcard">
                        <h3 style="margin-bottom:20px;">Construye la frase</h3>
                        <p style="opacity:0.6;">Ordena las palabras para formar la frase correcta</p>
                    </div>
                    <div class="sentence-builder">
                        <div class="sentence-display" id="sentence-display"></div>
                        <div class="word-bank" id="word-bank"></div>
                    </div>
                `;

                const wordBank = document.getElementById('word-bank');
                AppState.sentenceWords.forEach((word, index) => {
                    const wordEl = document.createElement('div');
                    wordEl.className = 'word-piece';
                    wordEl.innerText = word;
                    wordEl.dataset.index = index;
                    wordEl.onclick = () => addToSentence(wordEl);
                    wordBank.appendChild(wordEl);
                });
            }
        }

        // --- MATCHING GAME LOGIC ---
        function handleMatchSelection(button) {
            if (button.classList.contains('matched')) return;

            button.classList.add('matched');
            AppState.selectedMatches.push(button);

            if (AppState.selectedMatches.length === 2) {
                const first = AppState.selectedMatches[0];
                const second = AppState.selectedMatches[1];

                if (first.dataset.matchId === second.dataset.matchId && first.dataset.type !== second.dataset.type) {
                    // Correct match
                    document.getElementById('feedback').innerText = '¡Correcto!';
                    document.getElementById('feedback').style.color = '#2ecc71';

                    setTimeout(() => {
                        AppState.step++;
                        AppState.selectedMatches = [];
                        renderStep();
                    }, 1000);
                } else {
                    // Wrong match
                    document.getElementById('feedback').innerText = 'Inténtalo de nuevo';
                    document.getElementById('feedback').style.color = '#e74c3c';

                    setTimeout(() => {
                        first.classList.remove('matched');
                        second.classList.remove('matched');
                        AppState.selectedMatches = [];
                    }, 1000);
                }
            }
        }

        // --- DRAG & DROP FUNCTIONS ---
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            const dropZone = document.getElementById('drop-zone');

            if (draggedElement.innerText === AppState.currentLesson.content[AppState.step].es) {
                dropZone.innerHTML = `<i class="fas fa-check" style="color:#2ecc71; margin-right:10px;"></i> ${draggedElement.innerText}`;
                dropZone.style.borderColor = '#2ecc71';
                dropZone.style.background = 'rgba(46, 204, 113, 0.1)';

                document.getElementById('feedback').innerText = '¡Perfecto!';
                document.getElementById('feedback').style.color = '#2ecc71';

                setTimeout(() => {
                    AppState.step++;
                    renderStep();
                }, 1500);
            } else {
                dropZone.innerHTML = 'Inténtalo de nuevo';
                dropZone.style.borderColor = '#e74c3c';
                dropZone.style.background = 'rgba(231, 76, 60, 0.1)';
                document.getElementById('feedback').innerText = 'Incorrecto, prueba otra vez';
                document.getElementById('feedback').style.color = '#e74c3c';
            }
        }

        // --- SPEAKING PRACTICE FUNCTIONS ---
        function startListening() {
            if (!AppState.recognition) {
                document.getElementById('transcript-box').innerText = 'El reconocimiento de voz no está disponible';
                return;
            }

            const micButton = document.getElementById('mic-button');
            const transcriptBox = document.getElementById('transcript-box');
            const feedbackBox = document.getElementById('pronunciation-feedback');

            micButton.classList.add('listening');
            transcriptBox.innerText = 'Escuchando...';
            feedbackBox.innerHTML = '';

            AppState.recognition.onresult = function (event) {
                const transcript = event.results[0][0].transcript;
                transcriptBox.innerText = `Dijiste: "${transcript}"`;

                const correctAnswer = AppState.currentLesson.content[AppState.step].nl;
                const similarity = calculateSimilarity(transcript.toLowerCase(), correctAnswer.toLowerCase());

                if (similarity > 0.7) {
                    feedbackBox.innerHTML = '<i class="fas fa-check-circle"></i> ¡Excelente pronunciación!';
                    feedbackBox.className = 'pronunciation-feedback good';

                    setTimeout(() => {
                        AppState.step++;
                        renderStep();
                    }, 2000);
                } else {
                    feedbackBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Inténtalo de nuevo, escucha la pronunciación correcta:';
                    feedbackBox.className = 'pronunciation-feedback needs-work';
                    speak(correctAnswer);
                }
            };

            AppState.recognition.onend = function () {
                micButton.classList.remove('listening');
            };

            AppState.recognition.start();
        }

        function calculateSimilarity(str1, str2) {
            // Simple similarity calculation
            const longer = str1.length > str2.length ? str1 : str2;
            const shorter = str1.length > str2.length ? str2 : str1;

            if (longer.length === 0) return 1.0;

            const distance = levenshteinDistance(longer, shorter);
            return (longer.length - distance) / longer.length;
        }

        function levenshteinDistance(a, b) {
            // Simple Levenshtein distance implementation
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    const cost = a[j - 1] === b[i - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }

            return matrix[b.length][a.length];
        }

        // --- SENTENCE BUILDER FUNCTIONS ---
        function addToSentence(wordElement) {
            const sentenceDisplay = document.getElementById('sentence-display');
            const wordSpan = document.createElement('span');
            wordSpan.className = 'word-piece';
            wordSpan.innerText = wordElement.innerText;
            wordSpan.style.margin = '5px';
            wordSpan.style.cursor = 'pointer';
            wordSpan.onclick = () => removeFromSentence(wordSpan, wordElement);
            sentenceDisplay.appendChild(wordSpan);

            wordElement.style.opacity = '0.5';
            wordElement.style.cursor = 'default';
            wordElement.onclick = null;

            checkSentence();
        }

        function removeFromSentence(wordSpan, originalWord) {
            wordSpan.remove();
            originalWord.style.opacity = '1';
            originalWord.style.cursor = 'pointer';
            originalWord.onclick = () => addToSentence(originalWord);
            checkSentence();
        }

        function checkSentence() {
            const sentenceDisplay = document.getElementById('sentence-display');
            const words = Array.from(sentenceDisplay.children).map(span => span.innerText);
            const correctSentence = AppState.currentLesson.content[AppState.step].sentence.split(' ');

            if (words.length === correctSentence.length && words.every((word, i) => word === correctSentence[i])) {
                document.getElementById('feedback').innerText = '¡Frase correcta!';
                document.getElementById('feedback').style.color = '#2ecc71';

                setTimeout(() => {
                    AppState.step++;
                    renderStep();
                }, 1500);
            }
        }

        // --- CHECK ANSWER FUNCTION ---
        function checkAnswer(selected, correct, btn) {
            const feedback = document.getElementById('feedback');

            if (selected === correct) {
                btn.classList.add('correct');
                feedback.style.color = '#2ecc71';
                feedback.innerText = 'Goed zo!';
                speak(correct);

                setTimeout(() => {
                    AppState.step++;
                    renderStep();
                }, 1000);
            } else {
                btn.classList.add('wrong');
                feedback.style.color = '#e74c3c';
                feedback.innerText = 'Fout... probeer opnieuw';
                if (navigator.vibrate) navigator.vibrate(200);
            }
        }

        function finishGame(container) {
            document.getElementById('game-progress').style.width = '100%';

            if (!AppState.completed.includes(AppState.currentLesson.id)) {
                AppState.completed.push(AppState.currentLesson.id);
                AppState.score += 50;
                localStorage.setItem('score', AppState.score);
                localStorage.setItem('completed', JSON.stringify(AppState.completed));
            }

            container.innerHTML = `
                <div style="text-align:center; padding:40px;">
                    <i class="fas fa-trophy fa-5x" style="color:gold; margin-bottom:20px;"></i>
                    <h2>Gefeliciteerd!</h2>
                    <p>+50 XP</p>
                    <p style="opacity:0.7; margin-top:10px;">${AppState.currentLesson.content.length} items completados</p>
                </div>
             `;

            const btn = document.getElementById('next-btn');
            btn.classList.remove('hidden');
            btn.innerText = "TERUG NAAR MENU";
            btn.onclick = closeActivity;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'es-ES';
                u.rate = 0.9;
                window.speechSynthesis.speak(u);
            }
        }
    </script>
