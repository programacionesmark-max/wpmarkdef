        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Space+Grotesk:wght@300;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CSS VARIABLES & THEME SETUP --- */
        :root {
            /* ADULT THEME */
            --a-bg: #050505;
            --a-surface: #121212;
            --a-surface-hover: #1E1E1E;
            --a-primary: #CCFF00;
            --a-secondary: #00F0FF;
            --a-text: #Eaeaea;
            --a-border: rgba(255, 255, 255, 0.08);

            /* KID THEME */
            --k-bg: #F0F4F8;
            --k-surface: #FFFFFF;
            --k-primary: #FF6B6B;
            --k-secondary: #4ECDC4;
            --k-accent: #FFD93D;
            --k-text: #2D3436;
            --k-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);

            /* SHARED */
            --radius-xl: 24px;
            --radius-md: 16px;
            --max-width: 900px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* --- GLOBAL RESET --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--a-bg);
            color: var(--a-text);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding-bottom: 90px;
            /* Space for navbar */
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        /* --- MODE STYLES --- */
        /* ADULT */
        body[data-mode="adult"] {
            background: var(--a-bg);
        }

        body[data-mode="adult"] .glass {
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--a-border);
        }

        body[data-mode="adult"] .btn-primary {
            background: var(--a-primary);
            color: #000;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(204, 255, 0, 0.3);
            border-radius: 8px;
        }

        /* KID */
        body[data-mode="kid"] {
            font-family: 'Nunito', sans-serif;
            background: var(--k-bg);
            color: var(--k-text);
            background-image: radial-gradient(var(--k-secondary) 10%, transparent 10%), radial-gradient(var(--k-primary) 10%, transparent 10%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        body[data-mode="kid"] .glass {
            background: white;
            border-top: 2px solid #eee;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.05);
        }

        body[data-mode="kid"] .btn-primary {
            background: var(--k-primary);
            color: white;
            border-radius: 50px;
            border-bottom: 5px solid #d63031;
        }

        body[data-mode="kid"] .btn-primary:active {
            border-bottom-width: 0;
            transform: translateY(5px);
        }

        /* --- COMPONENTS --- */
        .app-container {
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- NAVIGATION --- */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            padding-bottom: 10px;
        }

        .nav-item {
            opacity: 0.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
            cursor: pointer;
        }

        .nav-item i {
            font-size: 1.5rem;
        }

        .nav-item span {
            font-size: 0.7rem;
            font-weight: bold;
        }

        .nav-item.active {
            opacity: 1;
            transform: translateY(-5px);
        }

        body[data-mode="adult"] .nav-item.active {
            color: var(--a-primary);
        }

        body[data-mode="kid"] .nav-item.active {
            color: var(--k-primary);
        }

        /* --- DASHBOARD --- */
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        body[data-mode="adult"] .stat-card {
            background: var(--a-surface-hover);
            border: 1px solid var(--a-border);
        }

        body[data-mode="kid"] .stat-card {
            background: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        /* --- GRID --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .card {
            padding: 15px;
            border-radius: var(--radius-md);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 140px;
            transition: 0.2s;
        }

        /* Adult Card */
        body[data-mode="adult"] .card {
            background: var(--a-surface);
            border: 1px solid var(--a-border);
        }

        body[data-mode="adult"] .card:active {
            border-color: var(--a-primary);
            transform: scale(0.98);
        }

        /* Kid Card */
        body[data-mode="kid"] .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 0 #eee;
        }

        body[data-mode="kid"] .card:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #eee;
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .card h3 {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .check-mark {
            position: absolute;
            top: 8px;
            right: 8px;
            color: #2ecc71;
            opacity: 0;
            font-size: 0.8rem;
        }

        .card.done .check-mark {
            opacity: 1;
        }

        /* --- ACTIVITY VIEW (OVERLAY) --- */
        #activity-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            z-index: 2000;
            /* SUPER HIGH Z-INDEX TO FIX ACCESS */
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .game-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .progress-container {
            flex: 1;
            height: 8px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #2ecc71;
            transition: 0.3s;
        }

        .game-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- FLASHCARDS & OPTIONS --- */
        .flashcard {
            width: 100%;
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        body[data-mode="adult"] .flashcard {
            background: #1a1a1a;
            border: 1px solid #333;
        }

        body[data-mode="kid"] .flashcard {
            background: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        .btn-opt {
            width: 100%;
            padding: 18px;
            margin-bottom: 10px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        body[data-mode="adult"] .btn-opt {
            background: #222;
            color: #fff;
            border: 1px solid #333;
        }

        body[data-mode="adult"] .btn-opt:active {
            border-color: var(--a-primary);
        }

        body[data-mode="kid"] .btn-opt {
            background: white;
            color: var(--k-text);
            border: 2px solid #f0f0f0;
        }

        body[data-mode="kid"] .btn-opt:active {
            border-color: var(--k-primary);
            background: #fff5f5;
        }

        .btn-opt.correct {
            background: #2ecc71 !important;
            color: white !important;
            border-color: #27ae60 !important;
        }

        .btn-opt.wrong {
            background: #e74c3c !important;
            color: white !important;
            border-color: #c0392b !important;
        }

        /* --- SPLASH --- */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 5000;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        .mode-btn {
            width: 200px;
            padding: 25px;
            margin: 10px;
            border-radius: 20px;
            cursor: pointer;
            text-align: center;
            border: 2px solid transparent;
        }

        /* --- PROFILE --- */
        .profile-container {
            text-align: center;
            padding: 40px 20px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: #eee;
        }

        body[data-mode="adult"] .avatar {
            background: linear-gradient(135deg, var(--a-primary), var(--a-secondary));
            color: black;
        }

        .webnox-badge {
            margin-top: 40px;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            text-decoration: none;
            opacity: 0.7;
            transition: 0.3s;
        }

        .webnox-badge:hover {
            opacity: 1;
            transform: scale(1.02);
        }

        body[data-mode="adult"] .webnox-badge {
            border: 1px solid #333;
            color: #888;
            background: #111;
        }

        body[data-mode="kid"] .webnox-badge {
            border: 2px dashed #ddd;
            color: #888;
            background: #fff;
        }
    </style>
</head>

                { id: 'a5', title: 'Wonen', icon: 'home', type: 'memory', content: [{ nl: 'Huis', es: 'Casa' }, { nl: 'Keuken', es: 'Cocina' }, { nl: 'Bad', es: 'Baño' }] },
                { id: 'a6', title: 'Werk', icon: 'briefcase', type: 'quiz', content: [{ nl: 'Baas', es: 'Jefe' }, { nl: 'Vergadering', es: 'Reunión' }, { nl: 'Geld', es: 'Dinero' }] },
                { id: 'a7', title: 'Hotel', icon: 'bed', type: 'quiz', content: [{ nl: 'Reservering', es: 'Reserva' }, { nl: 'Sleutel', es: 'Llave' }, { nl: 'Ontbijt', es: 'Desayuno' }, { nl: 'Kamer', es: 'Habitación' }] },
                { id: 'a8', title: 'Restaurant', icon: 'utensils', type: 'quiz', content: [{ nl: 'Menu', es: 'Menú' }, { nl: 'Ober', es: 'Camarero' }, { nl: 'Lekker', es: 'Rico' }, { nl: 'Ik wil...', es: 'Quiero...' }] },
                { id: 'a9', title: 'Winkelen', icon: 'shopping-bag', type: 'quiz', content: [{ nl: 'Hoeveel kost het?', es: '¿Cuánto cuesta?' }, { nl: 'Duur', es: 'Caro' }, { nl: 'Goedkoop', es: 'Barato' }] },
                { id: 'a10', title: 'Tijd', icon: 'clock', type: 'memory', content: [{ nl: 'Vandaag', es: 'Hoy' }, { nl: 'Morgen', es: 'Mañana' }, { nl: 'Gisteren', es: 'Ayer' }, { nl: 'Laat', es: 'Tarde' }] },
                { id: 'a11', title: 'Datum', icon: 'calendar-alt', type: 'quiz', content: [{ nl: 'Maand', es: 'Mes' }, { nl: 'Jaar', es: 'Año' }, { nl: 'Week', es: 'Semana' }] },
                { id: 'a12', title: 'Technologie', icon: 'wifi', type: 'quiz', content: [{ nl: 'Wachtwoord', es: 'Contraseña' }, { nl: 'Scherm', es: 'Pantalla' }, { nl: 'Oplader', es: 'Cargador' }] },
                { id: 'a13', title: 'Liefde', icon: 'heart', type: 'quiz', content: [{ nl: 'Ik hou van je', es: 'Te quiero' }, { nl: 'Kus', es: 'Beso' }, { nl: 'Mooi', es: 'Guapo/a' }] },
                { id: 'a14', title: 'Richting', icon: 'map-marked', type: 'quiz', content: [{ nl: 'Links', es: 'Izquierda' }, { nl: 'Rechts', es: 'Derecha' }, { nl: 'Rechtdoor', es: 'Todo recto' }] },
                { id: 'a15', title: 'Openbaar Vervoer', icon: 'subway', type: 'quiz', content: [{ nl: 'Trein', es: 'Tren' }, { nl: 'Halte', es: 'Parada' }, { nl: 'Kaartje', es: 'Billete' }] },
                { id: 'a16', title: 'Auto', icon: 'car', type: 'memory', content: [{ nl: 'Huren', es: 'Alquilar' }, { nl: 'Rijbewijs', es: 'Carnet' }, { nl: 'Benzine', es: 'Gasolina' }] },
                { id: 'a17', title: 'Gezondheid', icon: 'first-aid', type: 'quiz', content: [{ nl: 'Pijn', es: 'Dolor' }, { nl: 'Apotheek', es: 'Farmacia' }, { nl: 'Koorts', es: 'Fiebre' }] },
                { id: 'a18', title: 'Bank', icon: 'university', type: 'quiz', content: [{ nl: 'Pinnen', es: 'Pagar con tarjeta' }, { nl: 'Contant', es: 'Efectivo' }, { nl: 'Geldautomaat', es: 'Cajero' }] },
                { id: 'a19', title: 'Strand', icon: 'umbrella-beach', type: 'memory', content: [{ nl: 'Zand', es: 'Arena' }, { nl: 'Zee', es: 'Mar' }, { nl: 'Handdoek', es: 'Toalla' }] },
                { id: 'a20', title: 'Sport', icon: 'dumbbell', type: 'quiz', content: [{ nl: 'Sportschool', es: 'Gimnasio' }, { nl: 'Rennen', es: 'Correr' }, { nl: 'Wedstrijd', es: 'Partido' }] },
                { id: 'a21', title: 'Kantoor', icon: 'laptop', type: 'quiz', content: [{ nl: 'Klant', es: 'Cliente' }, { nl: 'Bellen', es: 'Llamar' }, { nl: 'Email', es: 'Correo' }] },
                { id: 'a22', title: 'Slang', icon: 'bolt', type: 'quiz', content: [{ nl: 'Gast', es: 'Tío' }, { nl: 'Leuk/Cool', es: 'Guay' }, { nl: 'Oké', es: 'Vale' }] },
                { id: 'a23', title: 'Politiek', icon: 'newspaper', type: 'quiz', content: [{ nl: 'Nieuws', es: 'Noticias' }, { nl: 'Krant', es: 'Periódico' }, { nl: 'Waarheid', es: 'Verdad' }] },
                { id: 'a24', title: 'Internet', icon: 'hashtag', type: 'memory', content: [{ nl: 'Volgen', es: 'Seguir' }, { nl: 'Delen', es: 'Compartir' }, { nl: 'Bericht', es: 'Mensaje' }] },
                { id: 'a25', title: 'Afscheid', icon: 'door-open', type: 'quiz', content: [{ nl: 'Tot morgen', es: 'Hasta mañana' }, { nl: 'Dag', es: 'Adiós' }, { nl: 'Veel geluk', es: 'Suerte' }] },
                { id: 'a26', title: 'Getallen', icon: 'sort-numeric-up', type: 'quiz', content: [{ nl: 'Twintig', es: 'Veinte' }, { nl: 'Honderd', es: 'Cien' }, { nl: 'Duizend', es: 'Mil' }] }
            ]
        };

        // --- STATE ---
        let AppState = {
            mode: 'adult',
            score: parseInt(localStorage.getItem('score')) || 0,
            streak: 1,
            completed: JSON.parse(localStorage.getItem('completed')) || [],
            currentLesson: null,
            step: 0
        };

        // --- INIT ---
        function initApp(mode) {
            AppState.mode = mode;
            document.body.setAttribute('data-mode', mode);

            // Fade out splash
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').classList.add('hidden');
                document.getElementById('main-nav').classList.remove('hidden');
                document.getElementById('app').classList.remove('hidden');
                renderDashboard();
                updateStats();
            }, 500);
        }

        // --- NAVIGATION ---
        function switchTab(tab) {
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-profile').classList.add('hidden');
            document.getElementById('view-' + tab).classList.remove('hidden');

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const idx = tab === 'dashboard' ? 0 : 1;
            document.querySelectorAll('.nav-item')[idx].classList.add('active');

            if (tab === 'profile') renderProfile();
        }

        // --- RENDER DASHBOARD ---
        function renderDashboard() {
            const grid = document.getElementById('lesson-grid');
            grid.innerHTML = '';

            const lessons = DB[AppState.mode];
            lessons.forEach((lesson, i) => {
                const isDone = AppState.completed.includes(lesson.id);
                const card = document.createElement('div');
                card.className = `card ${isDone ? 'done' : ''}`;
                card.innerHTML = `
                    <div class="check-mark"><i class="fas fa-check-circle"></i></div>
                    <div class="card-icon" style="color: ${AppState.mode === 'kid' ? 'var(--k-secondary)' : 'var(--a-primary)'}">
                        <i class="fas fa-${lesson.icon}"></i>
                    </div>
                    <h3>${lesson.title}</h3>
                `;
                card.onclick = function () { openGame(lesson); };

                card.style.animation = `fadeIn 0.5s ease forwards ${i * 0.05}s`;
                card.style.opacity = '0';

                grid.appendChild(card);
            });
        }

        function updateStats() {
            document.getElementById('score').innerText = AppState.score;
            document.getElementById('streak').innerText = AppState.streak;
        }

        function renderProfile() {
            document.getElementById('total-xp').innerText = AppState.score;
            document.getElementById('profile-name').innerText = AppState.mode === 'kid' ? 'Kleine Held' : 'Urban Nomad';

            // Level logic based on 25+ lessons
            const totalLessons = DB[AppState.mode].length * 50; // max xp
            let pct = Math.min((AppState.score / totalLessons) * 100, 100);

            document.getElementById('xp-bar').style.width = pct + '%';
        }

        // --- GAME ENGINE ---
        function openGame(lesson) {
            AppState.currentLesson = lesson;
            AppState.step = 0;

            document.getElementById('activity-view').classList.remove('hidden');
            document.getElementById('main-nav').classList.add('hidden');
            document.getElementById('lesson-title').innerText = lesson.title;

            renderStep();
        }

        function closeActivity() {
            document.getElementById('activity-view').classList.add('hidden');
            document.getElementById('main-nav').classList.remove('hidden');
            renderDashboard();
            updateStats();
        }

        function renderStep() {
            const container = document.getElementById('game-engine');
            const nextBtn = document.getElementById('next-btn');
            const feedback = document.getElementById('feedback');

            container.innerHTML = '';
            feedback.innerHTML = '';
            nextBtn.classList.add('hidden');

            const total = AppState.currentLesson.content.length;
            const progress = (AppState.step / total) * 100;
            document.getElementById('game-progress').style.width = progress + '%';

            if (AppState.step >= total) {
                finishGame(container);
                return;
            }

            const item = AppState.currentLesson.content[AppState.step];

            // --- QUIZ TYPE ---
            if (AppState.currentLesson.type === 'quiz') {
                container.innerHTML = `
                    <div class="flashcard">
                        <h2 style="font-size:2.5rem; margin-bottom:10px;">${item.nl}</h2>
                        <p style="opacity:0.6;">Kies de vertaling (Selecciona)</p>
                    </div>
                `;

                let options = [item.es];
                // Distractors from same lesson
                AppState.currentLesson.content.forEach(x => {
                    if (x.es !== item.es && options.length < 3) options.push(x.es);
                });
                // Fallback distractors if lesson is small
                while (options.length < 3) { options.push("Hola"); options.push("Sí"); }

                options.sort(() => Math.random() - 0.5);

                options.forEach(opt => {
                    const btn = document.createElement('div');
                    btn.className = 'btn-opt';
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswer(opt, item.es, btn);
                    container.appendChild(btn);
                });
            }

            // --- MEMORY / LEARN TYPE ---
            else if (AppState.currentLesson.type === 'memory') {
                container.innerHTML = `
                    <div class="flashcard" onclick="speak('${item.es}')">
                         <i class="fas fa-volume-up" style="opacity:0.5; margin-bottom:10px;"></i>
                        <h2 style="font-size:3rem; margin-bottom:10px; color:${AppState.mode === 'adult' ? 'var(--a-primary)' : 'var(--k-primary)'}">${item.es}</h2>
                        <h3 style="opacity:0.8;">(${item.nl})</h3>
                    </div>
                `;

                setTimeout(() => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-primary';
                    btn.innerText = 'Begrepen / Entendido';
                    btn.style.width = '100%';
                    btn.style.padding = '15px';
                    btn.style.border = 'none';
                    btn.style.cursor = 'pointer';
                    btn.onclick = () => { AppState.step++; renderStep(); };
                    container.appendChild(btn);
                    speak(item.es);
                }, 300);
            }
        }

        function checkAnswer(selected, correct, btn) {
            const feedback = document.getElementById('feedback');

            if (selected === correct) {
                btn.classList.add('correct');
                feedback.style.color = '#2ecc71';
                feedback.innerText = 'Goed zo!';
                speak(correct);

                setTimeout(() => {
                    AppState.step++;
                    renderStep();
                }, 1000);
            } else {
                btn.classList.add('wrong');
                feedback.style.color = '#e74c3c';
                feedback.innerText = 'Fout... probeer opnieuw';
                if (navigator.vibrate) navigator.vibrate(200);
            }
        }

        function finishGame(container) {
            document.getElementById('game-progress').style.width = '100%';

            if (!AppState.completed.includes(AppState.currentLesson.id)) {
                AppState.completed.push(AppState.currentLesson.id);
                AppState.score += 50;
                localStorage.setItem('score', AppState.score);
                localStorage.setItem('completed', JSON.stringify(AppState.completed));
            }

            container.innerHTML = `
                <div style="text-align:center; padding:40px;">
                    <i class="fas fa-trophy fa-5x" style="color:gold; margin-bottom:20px;"></i>
                    <h2>Gefeliciteerd!</h2>
                    <p>+50 XP</p>
                </div>
             `;

            const btn = document.getElementById('next-btn');
            btn.classList.remove('hidden');
            btn.innerText = "TERUG NAAR MENU";
            btn.onclick = closeActivity;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'es-ES';
                u.rate = 0.9;
                window.speechSynthesis.speak(u);
            }
        }
    </script>
</body>
